# /etc/nginx/sites-available/family-affairs  (replace DOMAIN; then certbot --nginx -d DOMAIN)
server {
    listen 80;
    server_name DOMAIN;
    root /var/www/family-affairs/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 64M;   # 20 photos per upload

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60;
    }
    location ~* \.(css|js|woff2|svg|png|jpg)$ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ~ /\.(?!well-known) { deny all; }
}
